name: Build Android APK
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Organize Web Assets Folder
        run: |
          mkdir -p www
          cp index.html www/ || true
          cp version.json www/ || true

      - name: Install Native App CLI Dependencies
        run: |
          npm install
          npm install @capacitor/cli @capacitor/android

      - name: Initialize Native App Project Matrix
        run: |
          npx cap init "Editor Pro" "com.editorpro.app" --web-dir=www
          npx cap add android

      - name: Force Android 15 & 16 Compatibility (API 36)
        run: |
          # The directory is fully created by 'cap add' above, so these will run perfectly now
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/g' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/g' android/variables.gradle
          fi
          if [ -f android/gradle.properties ]; then
            echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          fi

      - name: Compile and Bundle Native Android Assets
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug

      - name: Generate Direct Mobile Download Link
        run: |
          echo "UPLOAD STARTING"
          curl https://bashupload.com/Editor-Pro.apk --data-binary @android/app/build/outputs/apk/debug/app-debug.apk > download_url.txt
          echo "YOUR DIRECT DOWNLOAD LINK IS BELOW:"
          cat download_url.txt
