name: Deploy Web Application Assets
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Web Target Workspace
        run: |
          mkdir -p build
          cp index.html build/ || true
          cp version.json build/ || true
          echo "Web operational assets successfully bundled for live serving deployment."
