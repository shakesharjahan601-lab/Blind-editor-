name: Build Android APK
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Organize Web Assets Folder
        run: |
          mkdir -p www
          cp index.html www/ || true
          cp version.json www/ || true

      - name: Install Native App CLI Dependencies
        run: |
          npm install
          npm install @capacitor/cli @capacitor/android

      - name: Initialize Native App Project Matrix
        run: |
          npx cap init "Editor Pro" "com.shakesharjahan.editor" --web-dir=www
          npx cap add android

      - name: Generate Missing Launcher Resources
        run: |
          # Create default launcher graphic resource directories to satisfy resource linker
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/values
          
          # Inject basic fallback XML strings
          echo '<resources><string name="app_name">Editor Pro</string><string name="title_activity_main">MainActivity</string></resources>' > android/app/src/main/res/values/strings.xml

      - name: Fix Resource Linking and Force Android 15 & 16 Compatibility
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/g' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/g' android/variables.gradle
          fi
          if [ -f android/gradle.properties ]; then
            echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
            echo "android.useAndroidX=true" >> android/gradle.properties
            echo "android.enableJetifier=true" >> android/gradle.properties
          fi

      - name: Compile and Bundle Native Android Assets
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Generate Direct Mobile Download Link
        run: |
          echo "UPLOAD STARTING"
          curl https://bashupload.com/Editor-Pro.apk --data-binary @android/app/build/outputs/apk/debug/app-debug.apk > download_url.txt
          echo "YOUR DIRECT DOWNLOAD LINK IS BELOW:"
          cat download_url.txt
