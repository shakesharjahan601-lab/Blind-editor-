<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Pro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #00e5ff;
        }
        button {
            background-color: #00e5ff;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #00b2cc;
        }
        .update-banner {
            display: none;
            background-color: #333;
            border: 2px solid #00e5ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .status {
            margin-top: 15px;
            color: #aaaaaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Editor Pro</h1>
        <p>Welcome to your Native Android Video Editor Workspace.</p>
        
        <button onclick="checkUpdates()">Check for Updates</button>
        
        <div id="updateBanner" class="update-banner">
            <p id="updateMessage">A new update is available!</p>
            <button onclick="downloadUpdate()">Update Now</button>
        </div>

        <div id="statusMessage" class="status">App Version: 1.0.0</div>
    </div>

    <script>
        // Current installed version of this file code
        const CURRENT_VERSION = "1.0.0";
        
        // Permanent raw path to your version manifest file on GitHub
        const MANIFEST_UPDATE_URL = "https://raw.githubusercontent.com/shakesharjahan601-lab/Blind-editor-/main/version.json";
        
        // Permanent download path targeting your repository release file instead of a temporary site
        const DOWNLOAD_APK_URL = "https://github.com/shakesharjahan601-lab/Blind-editor-/releases/download/latest/app-debug.apk";

        async function checkUpdates() {
            const statusDiv = document.getElementById("statusMessage");
            const banner = document.getElementById("updateBanner");
            statusDiv.innerText = "Checking for updates...";

            try {
                // Fetch the online version status without browser cache getting in the way
                const response = await fetch(`${MANIFEST_UPDATE_URL}?nocache=${Date.now()}`);
                if (!response.ok) throw new Error("Manifest could not be reached");
                
                const data = await response.json();
                
                if (data.version !== CURRENT_VERSION) {
                    document.getElementById("updateMessage").innerText = `New Version ${data.version} is available!`;
                    banner.style.display = "block";
                    statusDiv.innerText = "Update found!";
                } else {
                    banner.style.display = "none";
                    statusDiv.innerText = "Your application is completely up to date.";
                }
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Failed to fetch updates. Please verify your internet connection.";
            }
        }

        function downloadUpdate() {
            // Forces the device system to open the permanent repository download path directly
            window.open(DOWNLOAD_APK_URL, '_system');
        }

        // Run checking loop automatically right when the interface launches
        window.onload = function() {
            setTimeout(checkUpdates, 1500);
        };
    </script>
</body>
</html>
