<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Pro</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #121212; color: #ffffff; text-align: center; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; background-color: #1e1e1e; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h1 { color: #00e5ff; margin-bottom: 5px; }
        .subtitle { color: #888888; font-size: 14px; margin-bottom: 20px; }

        /* Full-Screen Update Box Layout */
        .update-box { display: none; background-color: #262626; border: 2px solid #00e5ff; padding: 20px; border-radius: 12px; margin: 15px 0 25px 0; text-align: left; }
        .update-title { color: #00e5ff; font-weight: bold; font-size: 18px; margin-bottom: 8px; }
        .update-desc { color: #ccc; font-size: 14px; margin-bottom: 20px; }
        
        .btn-group { display: flex; gap: 10px; justify-content: flex-start; flex-wrap: wrap; }
        button { border: none; padding: 12px 18px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-view { background-color: #383838; color: #fff; }
        .btn-later { background-color: transparent; color: #aaaaaa; border: 1px solid #444; }
        .btn-update { background-color: #00e5ff; color: #121212; }

        .changelog-panel { display: none; background: #1a1a1a; padding: 12px; border-radius: 6px; margin-top: 15px; border-left: 3px solid #00e5ff; font-size: 13px; color: #bbb; line-height: 1.6; }
        .progress-wrapper { display: none; margin-top: 20px; background: #333; height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-fill { background: #00e5ff; height: 100%; width: 0%; transition: width 0.2s linear; }
        .progress-txt { color: #00e5ff; font-size: 12px; margin-top: 5px; text-align: right; display: none; }

        /* Main App Content */
        #mainAppContent { display: block; }
        .tab-nav { display: flex; background-color: #1a1a1a; border-radius: 10px; padding: 5px; margin-bottom: 25px; gap: 5px; }
        .tab-btn { flex: 1; background: none; color: #888888; padding: 10px; font-size: 14px; border-radius: 6px; margin: 0; }
        .tab-btn.active { background-color: #2a2a2a; color: #00e5ff; }
        .studio-panel { display: none; }
        .studio-panel.active { display: block; }
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 15px; }
        .tool-card-btn { background-color: #252525; color: #ffffff; border: 1px solid #333333; padding: 20px 10px; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; }
        .icon { font-size: 22px; }
        .settings-card { background-color: #1a1a1a; padding: 15px; border-radius: 12px; text-align: left; margin-top: 15px; }
        .settings-row { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Editor Pro</h1>
        <div class="subtitle">Mobile Media Processing Studio</div>

        <div id="updateCard" class="update-box">
            <div id="updateLabel" class="update-title">Update Found</div>
            <div id="reminderLabel" style="color: #ffb300; font-size: 13px; font-weight: bold; margin-bottom: 8px; display: none;">⚠️ Update Reminder Active</div>
            <div class="update-desc">A new version of the app is available for installation.</div>
            
            <div class="btn-group" id="btnGroup">
                <button class="btn-view" onclick="toggleChangelog()">View Changes</button>
                <button id="laterBtn" class="btn-later" onclick="dismissUpdateCard()">Later</button>
                <button class="btn-update" onclick="startNativeDownload()">Update</button>
            </div>

            <div id="changelogBox" class="changelog-panel">
                <strong>Changelog Updates:</strong><br>
                • Implemented real Native file downloader.<br>
                • Update layout strictly locks background screens.
            </div>

            <div id="progressContainer" class="progress-wrapper"><div id="progressBar" class="progress-fill"></div></div>
            <div id="progressStatus" class="progress-txt">Downloading: 0%</div>
        </div>

        <div id="mainAppContent">
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchStudioTab('videoTab', this)">Video Tools</button>
                <button class="tab-btn" onclick="switchStudioTab('audioTab', this)">Audio Tools</button>
                <button class="tab-btn" onclick="switchStudioTab('settingsTab', this)">Settings</button>
            </div>

            <div id="videoTab" class="studio-panel active">
                <div class="tools-grid">
                    <button class="tool-card-btn" onclick="triggerEngineTool('Insert Clip')"><span class="icon">➕</span>Insert Clip</button>
                    <button class="tool-card-btn" onclick="triggerEngineTool('Merge Videos')"><span class="icon">🔀</span>Merge</button>
                    <button class="tool-card-btn" onclick="triggerEngineTool('Trim Video')"><span class="icon">✂️</span>Trim</button>
                    <button class="tool-card-btn" onclick="triggerEngineTool('Video to Audio')"><span class="icon">🎵</span>To Audio</button>
                    <button class="tool-card-btn" onclick="triggerEngineTool('Noise Removal')"><span class="icon">🧹</span>Noise Fix</button>
                    <button class="tool-card-btn" onclick="triggerEngineTool('Add Music')"><span class="icon">🎼</span>Music</button>
                    <button class="tool-card-btn" style="grid-column: span 2;" onclick="triggerEngineTool('Compress Video')"><span class="icon">📦</span>Compress</button>
                </div>
            </div>

            <div id="audioTab" class="studio-panel">
                <div class="tools-grid">
                    <button class="tool-card-btn" onclick="triggerEngineTool('Insert Audio Clip')"><span class="icon">🎙️</span>Insert</button>
                    <button class="tool-card-btn" onclick="triggerEngineTool('Merge Audios')"><span class="icon">🔗</span>Merge</button>
                    <button class="tool-card-btn" onclick="triggerEngineTool('Trim Audio')"><span class="icon">🎚️</span>Trim</button>
                    <button class="tool-card-btn" onclick="triggerEngineTool('Audio Noise Removal')"><span class="icon">🤫</span>Noise Fix</button>
                    <button class="tool-card-btn" onclick="triggerEngineTool('Add Music Overlay')"><span class="icon">🎹</span>Music</button>
                    <button class="tool-card-btn" onclick="triggerEngineTool('Compress Audio')"><span class="icon">🗜️</span>Compress</button>
                </div>
            </div>

            <div id="settingsTab" class="studio-panel">
                <div class="settings-card">
                    <div class="settings-row">
                        <div>
                            <strong style="color: #00e5ff;">Check for Updates</strong>
                        </div>
                        <input type="checkbox" id="updateToggle" checked onchange="handleToggleChange()" style="transform: scale(1.3); accent-color: #00e5ff; cursor: pointer;">
                    </div>
                    <div id="manualCheckArea" style="margin-top: 15px; display: none;">
                        <button class="btn-update" style="width: 100%;" onclick="forceManualCheck()">Check Updates Instantly</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CURRENT_VERSION = "1.0.0";
        const MANIFEST_UPDATE_URL = "https://raw.githubusercontent.com/shakesharjahan601-lab/Blind-editor-/main/version.json";
        const DOWNLOAD_APK_URL = "https://github.com/shakesharjahan601-lab/Blind-editor-/releases/download/latest/app-debug.apk";

        function switchStudioTab(tabId, element) {
            document.querySelectorAll('.studio-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        function triggerEngineTool(toolName) { alert(toolName + " Tool Selected."); }

        async function checkUpdates() {
            const isAutoCheckEnabled = document.getElementById("updateToggle").checked;
            if (!isAutoCheckEnabled) return;

            try {
                const response = await fetch(`${MANIFEST_UPDATE_URL}?nocache=${Date.now()}`);
                if (!response.ok) return;
                
                const data = await response.json();
                
                if (data.version !== CURRENT_VERSION) {
                    let laterCount = parseInt(localStorage.getItem("update_later_count") || "0");
                    if (laterCount >= 2) {
                        document.getElementById("laterBtn").style.display = "none";
                        document.getElementById("reminderLabel").innerText = "🚨 Mandatory Update Required";
                        document.getElementById("reminderLabel").style.display = "block";
                    } else if (laterCount > 0) {
                        document.getElementById("reminderLabel").innerText = `⚠️ Reminder (${laterCount}/2)`;
                        document.getElementById("reminderLabel").style.display = "block";
                    }
                    document.getElementById("updateLabel").innerText = `Version ${data.version} Available`;
                    document.getElementById("mainAppContent").style.display = "none"; 
                    document.getElementById("updateCard").style.display = "block";
                }
            } catch (error) { console.error(error); }
        }

        function toggleChangelog() {
            const box = document.getElementById("changelogBox");
            box.style.display = box.style.display === "block" ? "none" : "block";
        }

        function dismissUpdateCard() {
            let laterCount = parseInt(localStorage.getItem("update_later_count") || "0");
            laterCount += 1;
            localStorage.setItem("update_later_count", laterCount.toString());
            document.getElementById("updateCard").style.display = "none";
            document.getElementById("mainAppContent").style.display = "block";
        }

        function handleToggleChange() {
            const isChecked = document.getElementById("updateToggle").checked;
            document.getElementById("manualCheckArea").style.display = isChecked ? "none" : "block";
        }

        function forceManualCheck() {
            document.getElementById("updateToggle").checked = true;
            checkUpdates();
            document.getElementById("updateToggle").checked = false;
        }

        function startNativeDownload() {
            document.getElementById("btnGroup").style.display = "none"; // Hide buttons while downloading
            document.getElementById("progressContainer").style.display = "block";
            document.getElementById("progressStatus").style.display = "block";
            
            // Native real-time fetch tracker
            const xhr = new XMLHttpRequest();
            xhr.open('GET', DOWNLOAD_APK_URL, true);
            xhr.responseType = 'blob'; // Download as file
            
            xhr.onprogress = function(event) {
                if (event.lengthComputable) {
                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                    document.getElementById("progressBar").style.width = percentComplete + "%";
                    document.getElementById("progressStatus").innerText = `Downloading Data: ${percentComplete}%`;
                }
            };
            
            xhr.onload = function() {
                if (this.status === 200) {
                    document.getElementById("progressStatus").innerText = "Download complete! Handing over to Android...";
                    localStorage.removeItem("update_later_count");
                    // Trigger Android's package installer intent
                    window.open(DOWNLOAD_APK_URL, '_system');
                } else {
                    document.getElementById("progressStatus").innerText = "Download failed. Please check connection.";
                    document.getElementById("btnGroup").style.display = "flex";
                }
            };

            xhr.onerror = function() {
                document.getElementById("progressStatus").innerText = "Network Error.";
                document.getElementById("btnGroup").style.display = "flex";
            };

            xhr.send();
        }

        window.onload = function() { setTimeout(checkUpdates, 500); };
    </script>
</body>
</html>
