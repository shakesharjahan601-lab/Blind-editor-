<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Editor Pro</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-6">

  <div class="w-full max-w-md bg-slate-900 rounded-2xl p-6 text-center border border-slate-800 shadow-xl">
    <h1 class="text-3xl font-black text-blue-500 mb-2">Editor Pro</h1>
    <p class="text-slate-400 mb-6 text-sm">Installation & Testing Base</p>
    
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6">
      <p class="text-sm text-emerald-400 font-bold">✓ Ready for Installation</p>
      <p class="text-xs text-slate-400 mt-1">Open this page on your mobile phone browser to install it onto your home screen.</p>
    </div>

    <p class="text-xs text-slate-500">Once installed, we will update this screen with our tools step-by-step.</p>
  </div>

  <script>
    // Register the service worker to allow offline/installation behavior
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registered!', reg))
          .catch(err => console.error('Service Worker Failed!', err));
      });
    }
  </script>
</body>
</html>
